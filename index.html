<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joe Dundore - Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* Custom CSS for a clean, readable blog layout */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #e5e7eb;
        }
        .section-title {
            position: relative;
            display: inline-block;
            margin-bottom: 1.5rem;
            font-weight: 600;
            color: #f9fafb;
        }
        .section-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -8px;
            width: 50%;
            height: 3px;
            background-color: #06b6d4;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="text-gray-200">

    <header class="bg-gray-900 text-white shadow-lg">
        <div class="container mx-auto p-4 flex flex-col md:flex-row justify-between items-center">
            <div class="text-2xl font-bold mb-4 md:mb-0">
                <a href="index.html" class="hover:text-cyan-400 transition duration-300">Joe Dundore</a>
                <span class="block text-sm font-light opacity-80">Professional Portfolio</span>
            </div>
            <nav>
                <ul class="flex flex-wrap justify-center space-x-4 md:space-x-6 text-lg">
                    <li><a href="index.html#about" class="hover:text-cyan-400 transition duration-300">About</a></li>
                    <li><a href="index.html#skills" class="hover:text-cyan-400 transition duration-300">Skills</a></li>
                    <li><a href="index.html#experience" class="hover:text-cyan-400 transition duration-300">Experience</a></li>
                    <li><a href="index.html#projects" class="hover:text-cyan-400 transition duration-300">Projects</a></li>
                    <li><a href="index.html#certifications" class="hover:text-cyan-400 transition duration-300">Certifications</a></li>
                    <li><a href="index.html#education" class="hover:text-cyan-400 transition duration-300">Education</a></li>
                    <li><a href="index.html#contact" class="hover:text-cyan-400 transition duration-300">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 py-16 md:py-24">
        <section id="blog-posts">
            <h2 class="text-3xl section-title mb-8">Blog Posts</h2>
            <div id="blog-post-list" class="space-y-12">
                </div>
        </section>
    </main>

    <footer class="bg-black text-gray-400 py-8 text-center text-sm">
        <div class="container mx-auto px-4">
            <p>&copy; 2025 Joe Dundore. All rights reserved.</p>
            <p class="mt-2">Designed with <span class="text-cyan-400">&hearts;</span> using Tailwind CSS</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
